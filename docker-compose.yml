# vinoandco.events: web (nginx serving the built site) + builder (rebuilds the
# site when platform data changes, spec 62 §9).
# Only public values here. Deploy-specific settings (domain routing, Traefik
# labels, the Cloudflare purge token) live in the deploy environment, not in
# this repository.
#
#   docker compose up --build web                      the site from the image's own build
#   docker compose --profile builder up --build -d     the site kept fresh by the builder
services:
  web:
    build:
      context: .
      target: web
      args:
        SITE_URL: ${SITE_URL:-https://vinoandco.events}
        SITE_INDEXING: ${SITE_INDEXING:-false}
        PUBLIC_ARENA_API: ${PUBLIC_ARENA_API:-https://api.arenasoldout.com}
        PUBLIC_FEED_TOKEN: ${PUBLIC_FEED_TOKEN:-}
        PUBLIC_META_PIXEL_ID: ${PUBLIC_META_PIXEL_ID:-}
        PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      ARENA_API_ORIGIN: ${PUBLIC_ARENA_API:-https://api.arenasoldout.com}
      SITE_INDEXING: ${SITE_INDEXING:-false}
      # The builder's current release; until it exists the image's own build is served.
      SITE_ROOT: /srv/site/current
      SITE_RELEASE_LINK: /srv/site/current
    volumes:
      - site:/srv/site:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Polls the feed every 2 minutes, builds into /site/releases/<time>, checks
  # the build (pages, required pages, media, redirect map) and switches
  # /site/current; a failed build leaves the last good one. GET :8081/healthz
  # reports the three freshness readings (not published to the outside).
  builder:
    build:
      context: .
      target: builder
      args:
        # Git short sha of the deployed commit (optional, the image build time otherwise).
        SITE_BUILD_ID: ${SITE_BUILD_ID:-}
    profiles: ["builder"]
    volumes:
      - builder-data:/data
      - site:/site
    environment:
      SITE_URL: ${SITE_URL:-https://vinoandco.events}
      SITE_INDEXING: ${SITE_INDEXING:-false}
      PUBLIC_ARENA_API: ${PUBLIC_ARENA_API:-https://api.arenasoldout.com}
      PUBLIC_FEED_TOKEN: ${PUBLIC_FEED_TOKEN:-}
      PUBLIC_META_PIXEL_ID: ${PUBLIC_META_PIXEL_ID:-}
      PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
      # Optional, secret: set in the deploy environment only.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
    restart: unless-stopped

volumes:
  # Snapshots, optimized images, builder state: part of the nightly server backup.
  builder-data:
  # Releases and the `current` link; web reads it, the builder writes it.
  site:
