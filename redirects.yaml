# Every address of the WordPress site and what the new site answers for it
# (spec 62 §4). The redirect check (npm run check:redirects) compares the built
# site with this file; it does not demand "no 404 anywhere", it demands the
# expected code for every listed address.
#
#   from   old path (exact match; a trailing /* means "this prefix")
#   code   200 = page exists in the new site, 301 = redirect to `to`, 410 = gone
#   to     target of a 301 (site path)
#   note   why
#   platform  (events) the page comes from the platform feed: checked only on a build from
#          the real feed (CHECK_PLATFORM_EVENTS=1, set by the builder), not from the sample.
#
# Source of the list: the WordPress sitemaps saved in docs/reference/sitemap/
# (Slim SEO, 2026-11-06). Query strings (?p=<id>, ?add-to-cart=…) are handled by
# nginx rules generated from this file, not listed one by one.
#
# Transition period (spec 62 §4.1, §14.2): requests to /payment-successful/ and
# /my-account/ (all languages) that carry OLD order parameters (order_id,
# order_key, WP password-reset links) are routed to WordPress by Traefik, not
# by this site. Everything else on those paths gets the 301 below. After
# WordPress is stopped the 301 applies always.

pages:
  # Same address, same page (code 200).
  - { from: /, code: 200 }
  - { from: /en/, code: 200 }
  - { from: /he/, code: 200 }
