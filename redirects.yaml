# Every address of the WordPress site and what the new site answers for it
# (spec 62 §4). The redirect check (npm run check:redirects) compares the built
# site with this file; it does not demand "no 404 anywhere", it demands the
# expected code for every listed address.
#
#   from   old path (exact match; a trailing /* means "this prefix")
#   code   200 = page exists in the new site, 301 = redirect to `to`, 410 = gone
#   to     target of a 301 (site path)
#   note   why
#
# Source of the list: the WordPress sitemaps saved in docs/reference/sitemap/
# (Slim SEO, 2026-11-06). Query strings (?p=<id>, ?add-to-cart=…) are handled by
# nginx rules generated from this file, not listed one by one.
#
# Transition period (spec 62 §4.1, §14.2): requests to /payment-successful/ and
# /my-account/ (all languages) that carry OLD order parameters (order_id,
# order_key, WP password-reset links) are routed to WordPress by Traefik, not
# by this site. Everything else on those paths gets the 301 below. After
# WordPress is stopped the 301 applies always.

pages:
  # Same address, same page (code 200).
  - { from: /, code: 200 }
  - { from: /en/, code: 200 }
  - { from: /he/, code: 200 }
  - { from: /upcoming-events/, code: 200 }
  - { from: /en/upcoming-events/, code: 200 }
  - { from: /he/yrwy-krwby/, code: 200 }
  - { from: /past-events/, code: 200 }
  - { from: /en/past-events/, code: 200 }
  - { from: /he/yrwy-kwdmy/, code: 200 }
  - { from: /private-events/, code: 200 }
  - { from: /en/private-events/, code: 200 }
  - { from: /he/yrwy-phrtyy/, code: 200 }
  - { from: /about-us/, code: 200 }
  - { from: /en/about-us/, code: 200 }
  - { from: /he/wdwthynw/, code: 200 }
  - { from: /contact-us/, code: 200 }
  - { from: /en/contact-us/, code: 200 }
  - { from: /he/swr-kshr/, code: 200 }
  - { from: /terms-conditions/, code: 200 }
  - { from: /en/terms-conditions/, code: 200 }
  - { from: /he/thny-whgblwth/, code: 200 }
  - { from: /privacy-policy/, code: 200 }
  - { from: /en/privacy-policy/, code: 200 }
  - { from: /he/mdynywth-phrtywth/, code: 200 }
  - { from: /refund_returns/, code: 200 }
  - { from: /en/return-policy/, code: 200 }
  - { from: /he/mdynywth-hxzrwth/, code: 200 }
  - { from: /sitemap.xml, code: 200 }
  - { from: /robots.txt, code: 200 }

redirects:
  # Personal pages moved to new paths (spec 62 §4.1).
  - { from: /payment-successful/, code: 301, to: /order-status/, note: "WooCommerce thank-you page" }
  - { from: /en/payment-successful/, code: 301, to: /en/order-status/ }
  - { from: /he/hthshlw-hslyx/, code: 301, to: /he/order-status/ }
  - { from: /my-account/, code: 301, to: /my-tickets/, note: "WooCommerce account -> My tickets by link (Р-9)" }
  - { from: /en/my-account/, code: 301, to: /en/my-tickets/ }
  - { from: /he/hxshbw-shly/, code: 301, to: /he/my-tickets/ }
  # WordPress leftovers: carts, checkouts and shop go to upcoming events,
  # test pages to the home page, the stray Russian page with a Hebrew slug to past events.
  - { from: /cart/, code: 301, to: /upcoming-events/ }
  - { from: /en/cart/, code: 301, to: /en/upcoming-events/ }
  - { from: /he/sl-knywth/, code: 301, to: /he/yrwy-krwby/ }
  - { from: /cart-2/, code: 301, to: /upcoming-events/ }
  - { from: /en/cart-2/, code: 301, to: /en/upcoming-events/ }
  - { from: /he/sl-knywth-2/, code: 301, to: /he/yrwy-krwby/ }
  - { from: /cart-3/, code: 301, to: /upcoming-events/ }
  - { from: /sl-knywth-3-2/, code: 301, to: /upcoming-events/ }
  - { from: /basket/, code: 301, to: /upcoming-events/ }
  - { from: /en/basket/, code: 301, to: /en/upcoming-events/ }
  - { from: /he/sl-knywth-3/, code: 301, to: /he/yrwy-krwby/ }
  - { from: /basket-2/, code: 301, to: /upcoming-events/ }
  - { from: /checkout/, code: 301, to: /upcoming-events/ }
  - { from: /en/checkout/, code: 301, to: /en/upcoming-events/ }
  - { from: /he/hshlmth-hzmnh/, code: 301, to: /he/yrwy-krwby/ }
  - { from: /checkout-2/, code: 301, to: /upcoming-events/ }
  - { from: /check-out/, code: 301, to: /upcoming-events/ }
  - { from: /en/check-out/, code: 301, to: /en/upcoming-events/ }
  - { from: /he/thshlw/, code: 301, to: /he/yrwy-krwby/ }
  - { from: /shop/, code: 301, to: /upcoming-events/ }
  - { from: /en/shop/, code: 301, to: /en/upcoming-events/ }
  - { from: /he/xnwth/, code: 301, to: /he/yrwy-krwby/ }
  - { from: /loop-test/, code: 301, to: / }
  - { from: /en/loop-test/, code: 301, to: /en/ }
  - { from: /he/bdykth-lwlh/, code: 301, to: /he/ }
  - { from: /yrwy-kwdmy/, code: 301, to: /past-events/ }
  # Product tags and categories go to the matching list.
  - { from: "/product-tag/upcoming/", code: 301, to: /upcoming-events/ }
  - { from: "/en/product-tag/upcoming/", code: 301, to: /en/upcoming-events/ }
  - { from: "/he/product-tag/krwb/", code: 301, to: /he/yrwy-krwby/ }
  - { from: "/product-tag/past/", code: 301, to: /past-events/ }
  - { from: "/en/product-tag/past/", code: 301, to: /en/past-events/ }
  - { from: "/he/product-tag/past/", code: 301, to: /he/yrwy-kwdmy/ }
  - { from: "/product-tag/*", code: 301, to: /upcoming-events/ }
  - { from: "/en/product-tag/*", code: 301, to: /en/upcoming-events/ }
  - { from: "/he/product-tag/*", code: 301, to: /he/yrwy-krwby/ }
  - { from: "/product-category/*", code: 301, to: /upcoming-events/ }
  - { from: "/en/product-category/*", code: 301, to: /en/upcoming-events/ }
  - { from: "/he/product-category/*", code: 301, to: /he/yrwy-krwby/ }

gone:
  # WordPress internals: answer 410, never the 404 page.
  - { from: "/wp-admin/*", code: 410 }
  - { from: /wp-login.php, code: 410 }
  - { from: /xmlrpc.php, code: 410 }
  - { from: "/wp-json/*", code: 410 }
  - { from: /wp-sitemap.xml, code: 410, note: "answered 404 on WordPress too" }
  - { from: "/sitemap-*.xml", code: 410, note: "Slim SEO sub-sitemaps; /sitemap.xml is rebuilt" }
  - { from: "/feed/*", code: 410 }
  # Uploads: event posters get a 301 to the new image address once the builder
  # has downloaded them (list generated from the WP export); everything else is gone.
  - { from: "/wp-content/*", code: 410 }
  - { from: "/wp-includes/*", code: 410 }

events:
  # WordPress event (product) pages, one product = one session (spec 62 §4).
  # Each gets either code 200 (the platform event has the same slug), or a 301 to
  # /event/<platform slug>/?session=<id>, or — for the 27 Bil24-era products that
  # are not on the platform — a 301 to the past-events list or a static page.
  # The table "WP slug -> platform event and session" is built once from the
  # WordPress database (_bil24_action_id / _lops_arena_* meta). Until then every
  # entry is `pending` and the check reports it without failing.
